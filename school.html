<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Lowtide status</title>
<meta name="theme-color" content="#45806b">
<link rel="icon" href="icon.png">
<style>
  :root { --bottom: #45806b; --foam: #f7faf5; --soft: rgba(247, 250, 245, 0.8); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
         color: var(--foam); background: var(--bottom); min-height: 100vh; display: grid; place-items: center;
         -webkit-font-smoothing: antialiased; text-align: center; padding: 16px; }
  .home { font-size: 13px; font-weight: 600; letter-spacing: .24em; text-transform: uppercase; color: var(--soft); }
  h1 { font-family: ui-serif, "New York", Georgia, serif; font-weight: 400; font-size: 34px; margin: 14px 0 22px; }
  .big { font-family: ui-serif, "New York", Georgia, serif; font-size: 64px; line-height: 1; }
  p { color: var(--soft); margin-top: 10px; }
</style>
</head>
<body>
<main>
  <div class="home">Lowtide</div>
  <h1 id="name">&nbsp;</h1>
  <div class="big" id="count">…</div>
  <p id="line">geactiveerd</p>
  <p id="until"></p>
</main>
<script>
// School/company status (max, 2026-11-10): only "N van M geactiveerd" and the end date. Fill in the Supabase URL at go-live.
const API = "SUPABASE_URL/functions/v1/company-status";
const k = new URLSearchParams(location.search).get("k") || "";
const show = (id, t) => { document.getElementById(id).textContent = t; };
fetch(`${API}?k=${encodeURIComponent(k)}`).then(r => r.ok ? r.json() : Promise.reject())
  .then(s => {
    show("name", s.name);
    show("count", `${s.used} van ${s.seats}`);
    show("until", "Geldig tot " + new Date(s.valid_until).toLocaleDateString("nl-NL", { day: "numeric", month: "long", year: "numeric" }));
  })
  .catch(() => { show("count", "–"); show("line", "Deze link werkt (nog) niet."); });
</script>
</body>
</html>
