<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Lowtide stoppen</title>
<meta name="theme-color" content="#45806b">
<link rel="icon" href="icon.png">
<style>
  :root { --bottom: #45806b; --foam: #f7faf5; --soft: rgba(247, 250, 245, 0.8); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
         color: var(--foam); background: var(--bottom); min-height: 100vh; display: grid; place-items: center;
         -webkit-font-smoothing: antialiased; text-align: center; padding: 16px; line-height: 1.5; }
  main { width: 100%; max-width: 440px; }
  .home { font-size: 13px; font-weight: 600; letter-spacing: .24em; text-transform: uppercase; color: var(--soft); }
  h1 { font-family: ui-serif, "New York", Georgia, serif; font-weight: 400; font-size: 32px; margin: 14px 0 18px; }
  p { color: var(--soft); margin-top: 10px; }
  button { margin-top: 22px; font: 600 17px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           color: var(--bottom); background: var(--foam); border: 0; border-radius: 999px; padding: 14px 28px; cursor: pointer; }
  button:disabled { opacity: .6; }
  a { color: inherit; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="home">Lowtide</div>
  <h1 id="title">Even geduld…</h1>
  <p id="info"></p>
  <button id="stop" hidden>Stoppen</button>
</main>
<script>
// Link in the day-5 mail of the free week (max, 2026-11-11). Opening the page changes nothing; only the button stops
// (mail scanners open links too). Stopping = access off at once for every phone, no invoice.
const API = "SUPABASE_URL/functions/v1/trial-stop";
const k = new URLSearchParams(location.search).get("k") || "";
const $ = (id) => document.getElementById(id);
const day = (d) => new Date(d).toLocaleDateString("nl-NL", { day: "numeric", month: "long" });
function show(d) {
  if (d.state === "open") {
    $("title").textContent = `Lowtide stoppen voor ${d.company}?`;
    $("info").textContent = `Jullie gratis week loopt tot ${day(d.until)}. Stoppen kost niets; alle telefoons worden meteen uitgelogd.`;
    $("stop").hidden = false;
  } else if (d.state === "stopped") {
    $("title").textContent = "Gestopt";
    $("info").textContent = `Lowtide staat uit voor ${d.company}. Er komt geen factuur. Bedankt voor het proberen.`;
    $("stop").hidden = true;
  } else if (d.state === "over") {
    $("title").textContent = "De gratis week is voorbij";
    $("info").innerHTML = `Opzeggen kan nog steeds: mail <a href="mailto:himbelton@gmail.com?subject=Lowtide%20opzeggen">himbelton@gmail.com</a>.`;
  } else fail();
}
function fail() {
  $("title").textContent = "Deze link werkt niet";
  $("info").innerHTML = `Mail <a href="mailto:himbelton@gmail.com?subject=Lowtide%20stoppen">himbelton@gmail.com</a>, dan regelen we het.`;
}
fetch(`${API}?k=${encodeURIComponent(k)}`).then((r) => r.json()).then(show).catch(fail);
$("stop").onclick = async () => {
  $("stop").disabled = true;
  try {
    show(await (await fetch(API, { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ k }) })).json());
  } catch { fail(); $("stop").hidden = true; }
};
</script>
</body>
</html>
