# Keeps nl/index.html (lowtide.eu/nl/) in sync with index.html: regenerates it on every push and commits it if it changed.
name: Build Dutch homepage
on:
  push:
    branches: [main]
    paths: [index.html, tools/build-nl.py]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-nl
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build-nl.py .
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add nl/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild nl/index.html from index.html"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
